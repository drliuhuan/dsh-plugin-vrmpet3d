name: Publish to npm

# 通过 Trusted Publishing (OIDC) 发布到 npm —— 无需任何 token。
# 触发方式：推送一个与 package.json version 一致的 tag，例如：
#   npm version 0.1.1 --no-git-tag-version  (或手动改 package.json)
#   git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # Trusted Publishing (OIDC) 必需
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if git merge-base --is-ancestor "$GITHUB_SHA" "$MAIN_SHA"; then
            echo "OK: tagged commit $GITHUB_SHA is on main ($MAIN_SHA)"
          else
            echo "::error::tag 不在 main 分支上，终止发布"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # release 构建禁用缓存

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json = $PKG_VERSION ; tag = $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag 与 package.json 版本不一致，终止发布"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish
