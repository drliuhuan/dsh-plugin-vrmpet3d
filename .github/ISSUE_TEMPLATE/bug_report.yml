name: 问题反馈
description: 报告桌宠显示、动作、状态同步或设置问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请勿提交 API Key、访问令牌或私人会话内容。
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      placeholder: 请填写实际版本号
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统与插件版本 / 提交
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 显示方式
      options:
        - 内置宠物
        - 独立悬浮窗
        - 内外置切换
        - 设置面板或其他
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请按顺序描述操作，并注明当时任务是否运行、使用什么模型或动作。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期结果与实际表现
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 错误提示、日志或截图（可选）
      description: 请保留完整错误提示，提交前去除敏感内容。
