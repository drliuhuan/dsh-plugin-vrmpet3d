<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title">vrmpet3d-dev · 切换模型</title>
  <meta name="color-scheme" content="dark light">
  <!--
    切换模型 — the model picker's own page (`/vrmpet3d-dev/picker`), opened from either pet's right-click menu.

    A FOURTH page beside 模型参数, 通用设置 and 初次安装引导, and opened exactly the same way: by the launcher on DSH
    Desktop (a real window, with the preload bridge, so the file dialog is native) and as a browser tab anywhere
    else (where the same drop target uploads the file's bytes instead).

    Its CONTENT is `lib/model-picker.js` — the same component the guide's ② 偏好模型 step mounts, which is what the
    operator asked for (「面板中和初次安装向导模型页完全一样」). Nothing about the grid is written here; this page
    is a header, a mount point and a settings subscription.

    The stylesheet is the shared `pages.css`.
  -->
  <link rel="stylesheet" href="/vrmpet3d-dev/window/lib/pages.css">
</head>
<body data-page="picker">
  <!--
    The page's own five pieces of text carry `data-i18n` and keep the Chinese inline: `lib/picker-page.js`
    resolves the language and calls `core.applyI18n`, and a page whose script never ran still reads in one
    language rather than showing empty nodes. `html lang` is that same Chinese default, and the script rewrites it
    once it knows better — it is NOT what the language is resolved from (see `core.browserLanguageHints`).
  -->
  <header class="page-header">
    <div class="eyebrow" data-i18n="eyebrow">VRMPET3D_DEV · MODELS</div>
    <h1 data-i18n="heading">切换模型</h1>
    <div id="status" role="status" aria-live="polite" data-i18n="statusLoading">正在读取…</div>
  </header>

  <main>
    <section class="settings-section" id="settings-0">
      <h2 data-i18n="sectionModels">模型</h2>
      <div class="card" id="picker-mount"></div>
    </section>
  </main>

  <!--
    The bootstrap reporter, the same one the two settings pages carry: a page stuck on 正在读取… has to say
    whether the script never ran, 404'd or threw, because all three look identical from the outside.
  -->
  <script>
    (function () {
      /**
       * The watchdog's OWN words, in its own two languages, because it runs BEFORE core.js and can use neither
       * `core.textFor` nor the settings store. `navigator.language` is the whole of its rule: the document's own
       * `lang` is the Chinese default every page here ships, so reading it would only ever say "Chinese".
       */
      var WORDS = {
        zh: {
          pageError: '页面脚本出错：',
          stuckMissing: '初始化卡住：model-picker.js 没有加载（检查 /vrmpet3d-dev/window/lib/model-picker.js 是否 404）。',
          stuckSlow: '初始化卡住：脚本已加载但没有完成初始化（看看窗口的控制台，或宿主是否提供 /vrmpet3d-dev/models 与 /vrmpet3d-dev/settings）。',
        },
        en: {
          pageError: 'Script error: ',
          stuckMissing: 'Stuck on startup: model-picker.js did not load — check whether /vrmpet3d-dev/window/lib/model-picker.js is a 404.',
          stuckSlow: 'Stuck on startup: the script loaded but never finished — check the window console, and whether the host serves /vrmpet3d-dev/models and /vrmpet3d-dev/settings.',
        },
      };
      var language = /^(zh|cn|chinese)/i.test(navigator.language || '') ? 'zh' : 'en';
      function t(key) { return WORDS[language][key]; }
      function show(message) {
        var status = document.getElementById("status");
        if (status) { status.textContent = message; status.className = "warn"; }
      }
      window.addEventListener("error", function (event) {
        var where = event.filename ? (language === 'zh' ? ' （' + event.filename + '）' : ' (' + event.filename + ')') : '';
        show(t('pageError') + (event.message || event.type) + where);
      }, true);
      window.setTimeout(function () {
        if (window.__VRMPET3D_DEV_PICKER_STATE__) return;
        if (!window.__VRMPET3D_DEV_MODEL_PICKER__) {
          show(t('stuckMissing'));
          return;
        }
        show(t('stuckSlow'));
      }, 2000);
    })();
  </script>
  <script src="/vrmpet3d-dev/window/lib/core.js"></script>
  <script src="/vrmpet3d-dev/window/lib/model-picker.js"></script>
  <script src="/vrmpet3d-dev/window/lib/picker-page.js"></script>
</body>
</html>
