<!doctype html>
<!--
  The desktop pet's page, served by the plugin's own host route (`/vrmpet3d-dev/window`).

  Deliberately served over the plugin's HTTP origin rather than loaded from disk: the pet
  fetches its model bytes from `/vrmpet3d-dev/asset/<id>`, and a `file://` page would make those
  requests cross-origin (or refused outright). Same origin means the asset, motion and model
  routes work exactly as they do for the in-app overlay, with no CORS and no special case.

  The sources below are the SAME files the overlay loads. They are served from
  `/vrmpet3d-dev/window/lib/`, a whitelisted prefix that reaches nothing else on disk.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>vrmpet3d-dev</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
    /* The canvas IS the pet's box, not the window: the model is framed to its canvas, so a
       screen-sized canvas draws a screen-sized pet. `lib/desktop-page.js` moves and resizes it
       every frame; these are only the starting values and the anchoring. */
    #pet { position: absolute; left: 0; top: 0; width: 220px; height: 300px; background: transparent; }
  </style>
</head>
<body>
<canvas id="pet"></canvas>
<script src="/vrmpet3d-dev/window/lib/client.vendor.js"></script>
<script src="/vrmpet3d-dev/window/lib/core.js"></script>
<script src="/vrmpet3d-dev/window/lib/scene.js"></script>
<script src="/vrmpet3d-dev/window/lib/client.js"></script>
<!-- The right-click MENU both pets share: one definition of its entries, their order and their words, so the
     two pets cannot offer different menus. It replaced each surface's own settings panel. -->
<script src="/vrmpet3d-dev/window/lib/menu.js"></script>
<script src="/vrmpet3d-dev/window/lib/desktop-page.js"></script>
<script>
(function () {
  var notes = [];
  /** The walk itself, published through `document.title` — never as an error (see `step`). */
  var steps = [];
  /**
   * A PROGRESS LINE the launcher can read even when nothing else works.
   *
   * Everything this glue does happens before the pet's frame loop, and each way it can stop — no preload bridge, a `config()` that
   * never answers, a `mount` that throws, a model that never becomes ready — used to look identical from outside: no pet, no errors,
   * and a status line that simply stopped changing. The operator's window on 2026-10-15 was exactly that, and the readout could not
   * even say whether the bridge existed.
   *
   * So the title carries the steps. It is ordinary DOM, it needs no bridge and no IPC, and `desktop/main.js` reads it on every poll.
   *
   * The steps are kept OUT of `notes`: that list is the page's ERRORS, and the first version pushed both into it — so the host's error
   * list read `glue | bridge | config` on a perfectly healthy window, and a real failure would have had to share three slots with the
   * walk that got there.
   */
  function step(name) {
    try {
      steps.push(name);
      document.title = 'vrmpet3d-dev: ' + steps.join(' > ');
    } catch (_error) {
      // A title that cannot be written must not stop the pet.
    }
  }

  step('glue');
  window.addEventListener('error', function (event) {
    notes.push(String(event.message));
    step('error:' + String(event.message));
    if (window.vrmpet3dDevDesktop) window.vrmpet3dDevDesktop.ready({ ok: false, error: notes.join('; ') });
  });

  var bridge = window.vrmpet3dDevDesktop;
  if (!bridge) {
    step('no-bridge');
    return;
  }
  step('bridge');
  if (typeof bridge.config !== 'function') {
    step('no-config');
    return;
  }

  bridge.config().then(function (config) {
    step('config');
    var canvas = document.getElementById('pet');
    // Only the CSS comes from here; the DRAWING BUFFER belongs to the renderer. Seeding the
    // attributes as well is what let a per-frame guard compare device pixels (330) against CSS
    // pixels (220): it resized the buffer every frame, after the render, so the window always
    // composited an empty canvas. The mount lays the element out to the pet's own box.

    var pet = globalThis.__VRMPET3D_DEV_DESKTOP__.mount({
      canvas: canvas,
      bridge: bridge,
      modelId: config.modelId,
      screen: config.screen,
      onError: function (error) {
        notes.push(String((error && error.message) || error));
        step('onError:' + String((error && error.message) || error));
      },
    });
    step('mount');

    // Reported so the launcher (and its self-test) knows the pet is up and what it is drawing
    // with: "the window opened" is not the same claim as "the pet is rendering".
    var gl = pet.scene && pet.scene.renderer ? pet.scene.renderer.getContext() : null;
    var debug = gl && gl.getExtension ? gl.getExtension('WEBGL_debug_renderer_info') : null;
    var info = {
      ok: Boolean(gl),
      webgl2: Boolean(gl) && typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext,
      renderer: debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : (gl ? gl.getParameter(gl.RENDERER) : null),
      version: gl ? gl.getParameter(gl.VERSION) : null,
      modelId: config.modelId,
      errors: notes,
    };
    step('gl:' + Boolean(gl));
    pet.ready.then(function () {
      info.loadedModel = pet.loadedModel();
      step('ready:' + (info.loadedModel || 'none'));
      bridge.ready(info);
    }, function (error) {
      // A model that never becomes ready is one of the ways this glue stops, and it used to be silent.
      step('modelFailed:' + String((error && error.message) || error));
      bridge.ready(info);
    });
  }).catch(function (error) {
    notes.push(String((error && error.message) || error));
    step('configFailed:' + String((error && error.message) || error));
    bridge.ready({ ok: false, errors: notes });
  });
})();
</script>
</body>
</html>
